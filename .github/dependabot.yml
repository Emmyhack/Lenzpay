version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
      react-native:
        patterns:
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

